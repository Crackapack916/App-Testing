name: mtgjson
# Loads MTGJSON into Neon, on demand only. The test run uses Scryfall (scryfall.yml); MTGJSON is
# the plan before a real launch (business context section 8).
# Requires the repository secret NEON_DATABASE_URL (Neon direct connection string).
on:
  workflow_dispatch:
    inputs:
      cards:
        description: "Also import every card (AllPrintings)"
        type: boolean
        default: true
jobs:
  # Scheduled runs skip quietly until the NEON_DATABASE_URL secret exists (docs/SETUP.md step 1).
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secret.outputs.ready }}
    steps:
      - id: secret
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Skipped: add the NEON_DATABASE_URL repository secret to turn this on"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::Add the NEON_DATABASE_URL repository secret"; exit 1; fi
          fi
  import:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.ready == 'true'
    timeout-minutes: 60
    concurrency: mtgjson-import
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import cards
        if: inputs.cards
        run: pnpm --filter @crackapack/catalog import --printings
      - name: Import prices
        run: pnpm --filter @crackapack/catalog import --prices
