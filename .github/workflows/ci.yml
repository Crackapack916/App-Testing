name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @crackapack/db test
      - run: pnpm --filter @crackapack/payments test
      - run: pnpm --filter @crackapack/catalog test
      - run: pnpm --filter @crackapack/api test
      - run: pnpm --filter @crackapack/staff exec playwright install --with-deps chromium
      - run: pnpm --filter @crackapack/staff test:e2e
      - run: pnpm --filter @crackapack/mobile test:e2e
